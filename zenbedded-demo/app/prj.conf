CONFIG_ZENBEDDED=y
CONFIG_ZENBEDDED_PLANT_SIM=y

# Logging is allowed on the boot and telemetry path only, never in the control
# thread. See SPEC.md "Hard constraints".
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# No heap anywhere. The control thread must not be able to reach an allocator
# even transitively; making the kernel pool zero-sized turns any attempt into a
# build or link error rather than a runtime surprise.
CONFIG_HEAP_MEM_POOL_SIZE=0

# Control math is float. The F767ZI has an FPU, and the wire protocol carries
# milli-units, so nothing here needs fixed point.
CONFIG_FPU=y

# Loop period is measured with the cycle counter and binned on-device.
CONFIG_TIMING_FUNCTIONS=y

# The kernel tick has to be fine enough to express the control period, or the
# timer quantises 1 ms up to whatever the tick happens to be and the loop
# silently runs at the wrong rate. 100 us granularity divides 1000 us exactly.
# control_thread.c carries a BUILD_ASSERT so this cannot regress unnoticed.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
