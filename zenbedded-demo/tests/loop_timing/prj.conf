CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_ZENBEDDED=y
CONFIG_ZENBEDDED_PLANT_SIM=y

# This test starts the real 1 kHz thread, so it must not also be autostarted.
CONFIG_ZENBEDDED_CONTROL_AUTOSTART=n

CONFIG_FPU=y
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_TIMING_FUNCTIONS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
