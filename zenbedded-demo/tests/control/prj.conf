CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192

CONFIG_ZENBEDDED=y
CONFIG_ZENBEDDED_PLANT_SIM=y

# These tests drive zb_control_step() directly, in virtual time, rather than
# starting the 1 kHz thread and racing it. Deterministic results are what makes
# asserting on exact failover thresholds worth anything.
CONFIG_ZENBEDDED_CONTROL_AUTOSTART=n

CONFIG_FPU=y
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_TIMING_FUNCTIONS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# The threaded setpoint fuzz test needs the producer and consumer to actually
# interleave.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1

CONFIG_ASSERT=y
