# Second serial port carries the CRSF link, the radio side connects to it
CONFIG_QEMU_EXTRA_FLAGS="-serial tcp:127.0.0.1:5760,server=on,wait=off"

# The game paces itself on the wall clock
CONFIG_QEMU_ICOUNT=n

CONFIG_KITE_RUSH_STRIP_BUFFER_SIZE=65536

# QEMU targets default to 100 Hz, too coarse to pace frames
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
