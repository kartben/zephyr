#
# EdgeTX model for the Kite Rush sample. Channel order AETR:
# CH1 aileron, CH2 elevator, CH3 throttle, CH4 rudder, CH5 to CH8 switches
# SA to SD. Internal module CRSF (ExpressLRS/Crossfire), 16 channels.
# The main view is the KiteRush widget, full screen (Layout1x1 with the top
# bar, flight mode, sliders and trims hidden).
# EdgeTX only lists model files named modelN.yml: install it under such a
# name (sim-setup.sh does this for the simulator).
semver: 2.11.0
header:
  name: "KiteRush"
  bitmap: ""
  labels: ""
disableThrottleWarning: 1
disableTelemetryWarning: 1
mixData:
  - destCh: 0
    srcRaw: "I0"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "Ail"
  - destCh: 1
    srcRaw: "I1"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "Ele"
  - destCh: 2
    srcRaw: "I2"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "Thr"
  - destCh: 3
    srcRaw: "I3"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "Rud"
  - destCh: 4
    srcRaw: "SA"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "SA"
  - destCh: 5
    srcRaw: "SB"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "SB"
  - destCh: 6
    srcRaw: "SC"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "SC"
  - destCh: 7
    srcRaw: "SD"
    mltpx: ADD
    weight: 100
    swtch: "NONE"
    name: "SD"
expoData:
  - mode: 3
    srcRaw: "Ail"
    weight: 100
    swtch: "NONE"
    curve:
      type: 1
      value: 0
    chn: 0
  - mode: 3
    srcRaw: "Ele"
    weight: 100
    swtch: "NONE"
    curve:
      type: 1
      value: 0
    chn: 1
  - mode: 3
    srcRaw: "Thr"
    weight: 100
    swtch: "NONE"
    curve:
      type: 1
      value: 0
    chn: 2
  - mode: 3
    srcRaw: "Rud"
    weight: 100
    swtch: "NONE"
    curve:
      type: 1
      value: 0
    chn: 3
inputNames:
  0:
    val: "Ail"
  1:
    val: "Ele"
  2:
    val: "Thr"
  3:
    val: "Rud"
thrTraceSrc: Thr
moduleData:
  0:
    type: TYPE_CROSSFIRE
    subType: 0
    channelsStart: 0
    channelsCount: 16
    failsafeMode: NOT_SET
    mod:
      crsf:
        telemetryBaudrate: 0
        crsfArmingMode: 0
        crsfArmingTrigger: NONE
screenData:
  0:
    LayoutId: Layout1x1
    layoutData:
      zones:
        0:
          widgetName: KiteRush
      options:
        0:
          type: Bool
          value:
            boolValue: 0
        1:
          type: Bool
          value:
            boolValue: 0
        2:
          type: Bool
          value:
            boolValue: 0
        3:
          type: Bool
          value:
            boolValue: 0
        4:
          type: Bool
          value:
            boolValue: 0
view: 0
