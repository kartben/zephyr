sample:
  name: zDSP audio spectrum
  description: Full-screen RGB565 spectrum and waterfall driven by the zDSP real FFT
common:
  tags:
    - display
    - zdsp
  build_only: true
  filter: dt_chosen_enabled("zephyr,display") and CONFIG_CPU_HAS_FPU and CONFIG_FULL_LIBC_SUPPORTED
  min_ram: 256
  min_flash: 512
tests:
  sample.subsys.dsp.spectrum:
    extra_args:
      - platform:stm32f769i_disco:SHIELD=st_b_lcd40_dsi1_mb1166
    integration_platforms:
      - stm32f769i_disco
  sample.subsys.dsp.spectrum.dmic:
    extra_args:
      - EXTRA_CONF_FILE=dmic.conf
      - platform:stm32f769i_disco:SHIELD=st_b_lcd40_dsi1_mb1166
    filter: dt_alias_exists("dmic0")
    integration_platforms:
      - stm32f769i_disco
