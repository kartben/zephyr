CONFIG_LOG=y

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=4
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_PLAYER=y

# The bus carries end-of-stream and errors, never data
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y

CONFIG_CPP=y
CONFIG_STD_CPP20=y
# ESP-DL computes in floating point: keep the FPU registers of each thread
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ESP_DL=y
CONFIG_ESP_SPIRAM=y
# ESP-DL heap, video buffers and the frame copy the detector works on
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304

# Three 320x240 RGB565 camera frames and the copy the detector works on, in PSRAM
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=614400
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=64

CONFIG_MAIN_STACK_SIZE=4096
