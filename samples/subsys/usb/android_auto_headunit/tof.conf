# Time-of-flight ranger standing in for a light sensor, on the serial boot
# target. Use with tof.overlay and the shield that carries the ranger:
#
#   west build -b stm32n6570_dk/stm32n657xx/sb -- \
#     -DSHIELD=st_b_cams_imx_mb1854 \
#     -DEXTRA_DTC_OVERLAY_FILE=tof.overlay -DEXTRA_CONF_FILE=tof.conf
#
# The driver carries an 86 KB firmware image that it uploads to the sensor.
# A serial boot image is loaded into the 511 KB of internal RAM and keeps its
# read-only data there too, so the head unit gives up the parts it can to make
# room for it.

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SAMPLE_AA_HU_TOF_NIGHT=y

# The ranger sits on the bus the navigation display is wired to, so that goes,
# and the audio path goes with it to free the rest
CONFIG_CHARACTER_FRAMEBUFFER=n
CONFIG_I2S=n
CONFIG_AUDIO_CODEC=n
CONFIG_AUDIO_DMIC=n

# The receive pipe moves to the memory the decoder heap is in, which has room
# to spare, rather than being made smaller. The USB transfer pool keeps its
# size: halving it makes the TLS handshake fail with a send error, since the
# transport cannot get a buffer to write into.
CONFIG_SAMPLE_AA_HU_USBH_RX_PIPE_SECTION="AXISRAM3"
CONFIG_SAMPLE_AA_HU_H264_HEAP_SIZE=1810432
CONFIG_USBH_STACK_SIZE=3072
CONFIG_USBH_USB_DEVICE_HEAP=2048
CONFIG_INPUT_THREAD_STACK_SIZE=3072
