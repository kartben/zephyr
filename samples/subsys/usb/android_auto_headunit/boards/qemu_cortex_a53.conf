# No phone can be reached from an emulator, so the head unit decodes the clip
# built into the image instead and everything after the decoder is unchanged.
CONFIG_SAMPLE_AA_HU_TRANSPORT_NONE=y
CONFIG_SAMPLE_AA_HU_H264=y
CONFIG_SAMPLE_AA_HU_DEMO_CLIP=y

# Say where each picture's time goes: the machine is emulated, so this is the
# one number that says whether the video keeps up
CONFIG_SAMPLE_AA_HU_VIDEO_PROFILE=y

# Nothing to report the light level to
CONFIG_SAMPLE_AA_HU_NIGHT_BUTTON=n

# The stream is one of the sample's own and needs one reference picture
CONFIG_SAMPLE_AA_HU_H264_HEAP_SIZE=2097152

# Sixty-four bit, where the sizes the sample carries for 32-bit boards are tight
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SAMPLE_AA_HU_GUI_STACK_SIZE=4096

# The surface, the decoder's arena and the reassembly buffer are each mapped in
# their own right, and the eight tables the architecture port starts with do
# not cover them
CONFIG_MAX_XLAT_TABLES=32
