CONFIG_SAMPLE_AA_HU_TRANSPORT_USB_HOST=y
CONFIG_USB_HOST_STACK=y

# zephyr_udc0 and zephyr_uhc0 are the same controller on this SoC
CONFIG_UDC_DRIVER=n

CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=16384
CONFIG_USBH_STACK_SIZE=4096
CONFIG_USBH_USB_DEVICE_HEAP=4096

CONFIG_SAMPLE_AA_HU_TX_CHUNK_SIZE=8192
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=8192
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=8192
CONFIG_MBEDTLS_HEAP_SIZE=40960

# External RAM holds the framebuffer and a full I_PCM key frame from the
# companion accessory sample
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SAMPLE_AA_HU_RX_MSG_SIZE=610000
