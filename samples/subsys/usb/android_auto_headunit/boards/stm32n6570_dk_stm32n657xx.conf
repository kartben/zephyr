# Kconfig fragments are not included by other fragments, so this is kept in step
# with stm32n6570_dk_stm32n657xx_sb.conf, which serves the other boot mode. Only
# the buffer placement at the end differs between the two.

CONFIG_SAMPLE_AA_HU_TRANSPORT_USB_HOST=y
CONFIG_USB_HOST_STACK=y

# The board has no USB device role in this sample
CONFIG_UDC_DRIVER=n

CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=16384
CONFIG_USBH_STACK_SIZE=4096
CONFIG_USBH_USB_DEVICE_HEAP=4096

# The panel is 800x480, the resolution the sample offers the phone
CONFIG_STM32_LTDC_RGB565=y

# A phone packs several TLS records of video into one frame, and the frame
# length field allows up to 64 KB
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_SAMPLE_AA_HU_RX_FRAME_SIZE=65600

# A real phone's service discovery response and its video messages are decoded
# on the receive thread's stack
CONFIG_SAMPLE_AA_HU_RX_STACK_SIZE=16384

# The framebuffer and a full I_PCM key frame from the companion accessory
# sample do not fit the internal RAM
CONFIG_SAMPLE_AA_HU_BUFFERS_IN_EXT_RAM=y
CONFIG_SAMPLE_AA_HU_BUFFERS_SECTION="PSRAM"
CONFIG_SAMPLE_AA_HU_RX_MSG_SIZE=610000

# The panel reports touches on its interrupt line, so it does not have to be
# polled. Touch events are forwarded from the input thread, which encrypts and
# writes them to USB.
CONFIG_INPUT_GT911_INTERRUPT=y
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=3
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# Touches are handled on the input thread, which defaults to the lowest
# application priority and is starved by the receive thread decoding video
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=4

# A held finger reports faster than the console can describe it dropping events
CONFIG_INPUT_LOG_LEVEL_ERR=y

# H.264 decoding is limited by CPU time rather than code size
CONFIG_SPEED_OPTIMIZATIONS=y

# The board's digital microphone, so the phone's voice assistant can be
# spoken to from the head unit
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# The MP23DB01HP takes its operating mode from the clock it is given: 0.54 to
# 1.1 MHz selects its low-power mode, 1.5 to 3.3 MHz its performance mode.
# Speech comes nowhere near the 120 dB SPL the low-power mode withstands, and
# that mode is 17 dB more sensitive for the same signal-to-noise ratio, so ask
# for the low-power one. Its lower half is out of reach: the filter divides a
# 2 GHz clock by at most 2048, which stops at 977 kHz. The driver takes
# 1.025 MHz out of this window, which divides down to 16009 Hz, closer to the
# 16 kHz the channel carries than the megahertz clocks are.
CONFIG_SAMPLE_AA_HU_MIC_CLK_MIN_HZ=900000
CONFIG_SAMPLE_AA_HU_MIC_CLK_MAX_HZ=1025000

# The next turn is shown on an M5Stack Unit Mini OLED wired to the Arduino
# header, and the audio the phone sends is played through the board's codec
CONFIG_I2S=y
CONFIG_AUDIO_CODEC=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Reference pictures in the four AXISRAM banks the overlay turns on, which is
# worth 30 to 50 fps at 800x480. The span holds one 800x480 stream and little
# more, so keep a roomier heap in PSRAM for a phone that asks for more.
CONFIG_SAMPLE_AA_HU_H264_HEAP_SECTION="AXISRAM3"
CONFIG_SAMPLE_AA_HU_H264_HEAP_SIZE=1769472
CONFIG_SAMPLE_AA_HU_H264_HEAP_FALLBACK=y

# The receive pipe joins it there. The image's own RAM is the scarcest memory
# on this board, and the pipe is only ever touched by the processor.
CONFIG_SAMPLE_AA_HU_USBH_RX_PIPE_SECTION="AXISRAM3"

# Catch a thread running off its stack as a fault that says so, rather than as
# whatever the memory underneath happens to do next
CONFIG_HW_STACK_PROTECTION=y

# Helium shares the floating point register bank, so the decoder's vector
# kernels are only compiled in when the unit is enabled.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# This boot mode links the image into AXISRAM1, which is where the YUV and
# microphone buffers go by default. The linker sizes the image and those
# buffers against separate regions that name the same memory, so neither
# overflows and the two silently overlap. Put them in the external RAM that
# already holds the framebuffer; it costs a few percent of the frame rate.
CONFIG_SAMPLE_AA_HU_YUV_BUFFERS_SECTION="PSRAM"
CONFIG_SAMPLE_AA_HU_MIC_BUFFERS_SECTION="PSRAM"
