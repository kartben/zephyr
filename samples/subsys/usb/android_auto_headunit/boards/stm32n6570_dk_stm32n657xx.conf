# Kconfig fragments are not included by other fragments, so this is kept
# identical to stm32n6570_dk_stm32n657xx_sb.conf, which serves the other boot mode.

CONFIG_SAMPLE_AA_HU_TRANSPORT_USB_HOST=y
CONFIG_USB_HOST_STACK=y

# The board has no USB device role in this sample
CONFIG_UDC_DRIVER=n

CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=16384
CONFIG_USBH_STACK_SIZE=4096
CONFIG_USBH_USB_DEVICE_HEAP=4096

# The panel is 800x480, the resolution the sample offers the phone
CONFIG_STM32_LTDC_RGB565=y

# A phone packs several TLS records of video into one frame, and the frame
# length field allows up to 64 KB
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_SAMPLE_AA_HU_RX_FRAME_SIZE=65600

# A real phone's service discovery response and its video messages are decoded
# on the receive thread's stack
CONFIG_SAMPLE_AA_HU_RX_STACK_SIZE=16384

# The framebuffer and a full I_PCM key frame from the companion accessory
# sample do not fit the internal RAM
CONFIG_SAMPLE_AA_HU_BUFFERS_IN_EXT_RAM=y
CONFIG_SAMPLE_AA_HU_BUFFERS_SECTION="PSRAM"
CONFIG_SAMPLE_AA_HU_RX_MSG_SIZE=610000

# The panel reports touches on its interrupt line, so it does not have to be
# polled. Touch events are forwarded from the input thread, which encrypts and
# writes them to USB.
CONFIG_INPUT_GT911_INTERRUPT=y
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=3
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# Touches are handled on the input thread, which defaults to the lowest
# application priority and is starved by the receive thread decoding video
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=4

# A held finger reports faster than the console can describe it dropping events
CONFIG_INPUT_LOG_LEVEL_ERR=y

# H.264 decoding is limited by CPU time rather than code size
CONFIG_SPEED_OPTIMIZATIONS=y
