# The head unit is the USB host and the phone is the device, which is what the
# SoC's high speed controller does here. The board overlay puts it on the USB-C
# connector; SW4-8 has to select USBHS for that connector rather than USBFS.
CONFIG_SAMPLE_AA_HU_TRANSPORT_USB_HOST=y
CONFIG_USB_HOST_STACK=y
CONFIG_UDC_DRIVER=n
CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=16384
CONFIG_USBH_STACK_SIZE=4096
CONFIG_USBH_USB_DEVICE_HEAP=4096

# The host mode pin is driven by a hog rather than by any driver
CONFIG_GPIO_HOGS=y

CONFIG_SAMPLE_AA_HU_H264=y

# Neither the reference pictures nor the framebuffer come close to fitting in
# the internal RAM, so both go to the 64 MB of SDRAM the board carries.
CONFIG_SAMPLE_AA_HU_BUFFERS_IN_EXT_RAM=y
CONFIG_SAMPLE_AA_HU_BUFFERS_SECTION="SDRAM"
CONFIG_SAMPLE_AA_HU_H264_HEAP_SECTION="SDRAM"

# What a real phone asks for: it sends TLS records of the full sixteen
# kilobytes and packs several of them into one frame, and its access units are
# far larger than the companion sample's.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_SAMPLE_AA_HU_RX_FRAME_SIZE=65600
CONFIG_SAMPLE_AA_HU_RX_MSG_SIZE=610000

# The receive thread runs the TLS record layer as well as the protocol, and
# builds messages that are large on a 64-bit-wide bus
CONFIG_SAMPLE_AA_HU_RX_STACK_SIZE=16384

# The decoder works out of the external RAM its pictures are too large for
# anywhere else, and reaching it uncached costs about five sixths of the frame
# rate. The framebuffer is flushed before the display controller reads it.
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y

# The SoC forces the cache write-through by default, which leaves every store
# to the external RAM on the bus. Only the framebuffer is read by anything
# other than the core, and it is flushed before the panel is given it.
CONFIG_CPU_RA_DCACHE_WRITEBACK=y

# The pictures are split off from the rest of the decoder state so that the
# two can live in different memories.
CONFIG_H264BSD_PICTURE_MALLOC="aa_h264_picture_malloc"
CONFIG_H264BSD_PICTURE_FREE="aa_h264_picture_free"

# Without output reordering a phone's baseline stream needs two pictures, and
# two fit in the internal RAM once the second core's bank is taken in. Every
# read of a reference and every pass over the picture being built then costs a
# fraction of what it does in the external RAM. A stream that wants more falls
# back to the external heap rather than stopping.
CONFIG_SAMPLE_AA_HU_H264_HEAP_SECTION=".bss"
CONFIG_SAMPLE_AA_HU_H264_HEAP_SIZE=1155072
CONFIG_SAMPLE_AA_HU_H264_HEAP_FALLBACK=y

# Measured high water mark is 333 KB, and it moves a little with the stream
CONFIG_SAMPLE_AA_HU_H264_STATE_HEAP_SIZE=380928

# Make room: none of these is read often enough to earn internal RAM
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y
CONFIG_SAMPLE_AA_HU_TX_BUFFERS_SECTION="SDRAM"
CONFIG_SAMPLE_AA_HU_USBH_RX_PIPE_SECTION="SDRAM"

# The audio the phone sends is played through the board's DA7212, and one of
# the two microphones under the board is what the phone's assistant hears.
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_DMIC=y
CONFIG_I2S=y

# The SSIE reads the rate of the timer output it takes its audio clock from, so
# the generic PWM clock at 51 has to be up before it
CONFIG_I2S_INIT_PRIORITY=52

# The data cache is in write-back mode for the decoder's sake and the SSIE
# driver flushes nothing, so a transfer controller reading the blocks out of
# the internal RAM would read what the processor has not written back yet.
# Filling the FIFO from the interrupt costs a few thousand interrupts a second.
CONFIG_I2S_RENESAS_RA_SSIE_DTC=n

# The PDM interface runs from the 8 MHz MOCO, which it divides by an even
# number: only 4 MHz and 800 kHz decimate to exactly 16 kHz, and 1 MHz lands
# 0.8 % above it. This window takes the 1 MHz, which is the clock a PDM
# microphone is usually specified at; the datasheet of the part fitted here
# was not to hand.
# The SPH0690 runs its normal mode between 1.1 and 4.8 MHz, and is out of
# specification between that and its 900 kHz low power ceiling. Given the whole
# band the driver picks 4 MHz, the only divider of the 8 MHz PDMIFCLK that
# decimates to exactly 16 kHz.
CONFIG_SAMPLE_AA_HU_MIC_CLK_MIN_HZ=1100000
CONFIG_SAMPLE_AA_HU_MIC_CLK_MAX_HZ=4800000

# One block is twenty milliseconds of the channel's 16 kHz
CONFIG_AUDIO_DMIC_RENESAS_RA_PDM_BLOCK_SAMPLES=320

# Half a second of queued audio per channel, and two thirds of a second of
# microphone blocks, neither of which the internal RAM has room for
CONFIG_SAMPLE_AA_HU_PLAY_BUFFERS_SECTION="SDRAM"
CONFIG_SAMPLE_AA_HU_MIC_BUFFERS_SECTION="SDRAM"

# The panel reports touches on its interrupt line, so it does not have to be
# polled. Touch events are forwarded from the input thread, which encrypts and
# writes them to USB.
CONFIG_INPUT_FT5336_INTERRUPT=y
CONFIG_INPUT_FT5336_MAX_TOUCH_POINTS=3
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# The surface the panel scans is written once per frame and read by nothing
# else on the processor side, so it is kept out of the data cache.
CONFIG_SAMPLE_AA_HU_FB_SECTION="FB_SDRAM"
CONFIG_SAMPLE_AA_HU_FB_UNCACHED=y
