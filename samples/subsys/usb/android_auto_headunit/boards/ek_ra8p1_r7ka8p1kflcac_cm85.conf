# The head unit is the USB host and the phone is the device, but Zephyr has no
# host driver for this SoC's USB controller, only a device one. The phone
# therefore cannot be attached directly here; what this configuration runs is
# the TCP transport, driven over Ethernet by scripts/aa_headunit.py.
CONFIG_SAMPLE_AA_HU_TRANSPORT_TCP=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_SAMPLE_AA_HU_H264=y

# Neither the reference pictures nor the framebuffer come close to fitting in
# the internal RAM, so both go to the 64 MB of SDRAM the board carries.
CONFIG_SAMPLE_AA_HU_BUFFERS_IN_EXT_RAM=y
CONFIG_SAMPLE_AA_HU_BUFFERS_SECTION="SDRAM"
CONFIG_SAMPLE_AA_HU_H264_HEAP_SECTION="SDRAM"

CONFIG_MBEDTLS_HEAP_SIZE=65536
