CONFIG_SAMPLE_AA_HU_TRANSPORT_TCP=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n

CONFIG_MBEDTLS_HEAP_SIZE=65536

# A phone packs several TLS records of video into one frame, and the frame
# length field allows up to 64 KB
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_SAMPLE_AA_HU_RX_FRAME_SIZE=65600

# A phone's service discovery response and its video messages are decoded on
# the receive thread's stack
CONFIG_SAMPLE_AA_HU_RX_STACK_SIZE=16384

# Audio both ways. The board's I2S TX, DMIC and dummy codec devices read and
# write raw PCM on the host, so the phone's audio and the microphone it hears
# are host files or pipes rather than hardware.
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_DMIC=y
