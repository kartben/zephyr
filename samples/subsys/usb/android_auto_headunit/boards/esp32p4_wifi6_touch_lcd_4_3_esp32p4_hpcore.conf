CONFIG_SAMPLE_AA_HU_TRANSPORT_USB_HOST=y
CONFIG_USB_HOST_STACK=y

# zephyr_udc0 and zephyr_uhc0 are the same controller on this SoC
CONFIG_UDC_DRIVER=n

CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=16384
CONFIG_USBH_STACK_SIZE=4096
CONFIG_USBH_USB_DEVICE_HEAP=4096

CONFIG_SAMPLE_AA_HU_H264=y

# The 480x800 panel scans in portrait. Turned a quarter turn it is exactly the
# 800x480 picture the phone sends, which then needs no scaling.
CONFIG_SAMPLE_AA_HU_ROTATE_90=y

# The sample scans its own two surfaces out of PSRAM, so the display driver
# needs none of its own
CONFIG_DISPLAY_ESP32_DSI_FB_NUM=0

# What a real phone asks for: it sends TLS records of the full sixteen
# kilobytes and packs several of them into one frame
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_ESP_MBEDTLS_HEAP_ALLOC_EXT_RAM=y
CONFIG_SAMPLE_AA_HU_RX_FRAME_SIZE=65600
CONFIG_SAMPLE_AA_HU_RX_MSG_SIZE=610000
CONFIG_SAMPLE_AA_HU_RX_STACK_SIZE=16384

# The pictures go to PSRAM with the other large buffers. The rest of the
# decoder state is read far more often per byte and stays in internal RAM,
# which the decoder's hot code shares. It has held 338368 bytes at 800x480.
CONFIG_SAMPLE_AA_HU_H264_STATE_HEAP_SECTION=".bss"
CONFIG_SAMPLE_AA_HU_H264_STATE_HEAP_SIZE=360448

# Only the processor touches these, so they need not take internal RAM
CONFIG_SAMPLE_AA_HU_TX_BUFFERS_SECTION=".ext_ram.bss"
CONFIG_SAMPLE_AA_HU_USBH_RX_PIPE_SECTION=".ext_ram.bss"

# The GT911 INT line is not routed, so the driver polls it
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=3
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# Touches are handled on the input thread, which defaults to the lowest
# application priority and is starved by the receive thread decoding video
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=4
CONFIG_INPUT_LOG_LEVEL_ERR=y

# H.264 decoding is limited by CPU time rather than code size
CONFIG_SPEED_OPTIMIZATIONS=y

# The pixel processing accelerator converts and turns the pictures
CONFIG_ESP32_PPA=y

# Every picture crosses PSRAM several times, and a longer cache line fetches
# it in longer bursts: 128 bytes reads a third faster than 64
CONFIG_ESP32_CACHE_L2_LINE_128B=y
CONFIG_SPIRAM_SPEED_250M=y

# The log thread overran its 768 byte default into the next stack with SMP
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Both HP cores: pictures are composed on the second one, and the deblocking
# follows the decoder there a row of macroblocks behind
CONFIG_SMP=y
CONFIG_H264BSD_DEBLOCK_THREAD=y
# and packs the rows it is done with for the accelerator while they are cached
CONFIG_H264BSD_DEBLOCK_ROWS_HOOK="aa_h264_rows_ready"
