// Subset of the Android Auto projection protocol messages used by the
// sample, written from the wire format. Only the fields the sample reads or
// writes are declared; unknown fields are skipped by nanopb. Message ids are
// defined in aa_ids.h, enumerations are carried as int32 so that unknown
// values do not fail decoding.

syntax = "proto2";

message AuthCompleteIndication {
  optional int32 status = 1;
}

message ServiceDiscoveryRequest {
  optional string device_name = 4;
  optional string device_brand = 5;
}

message VideoConfig {
  optional int32 video_resolution = 1;
  optional int32 video_fps = 2;
  optional uint32 margin_width = 3;
  optional uint32 margin_height = 4;
  optional uint32 dpi = 5;
}

message AVChannel {
  optional int32 stream_type = 1;
  optional int32 audio_type = 2;
  repeated VideoConfig video_configs = 4;
  optional bool available_while_in_call = 5;
}

message TouchConfig {
  optional uint32 width = 1;
  optional uint32 height = 2;
}

message InputChannel {
  optional TouchConfig touch_screen_config = 2;
  optional TouchConfig touch_pad_config = 3;
}

message Sensor {
  optional int32 type = 1;
}

message SensorChannel {
  repeated Sensor sensors = 1;
}

message ChannelDescriptor {
  optional uint32 channel_id = 1;
  optional SensorChannel sensor_channel = 2;
  optional AVChannel av_channel = 3;
  optional InputChannel input_channel = 4;
}

message ServiceDiscoveryResponse {
  repeated ChannelDescriptor channels = 1;
  optional string head_unit_name = 2;
  optional string car_model = 3;
}

message ChannelOpenRequest {
  optional int32 priority = 1;
  optional int32 channel_id = 2;
}

message ChannelOpenResponse {
  optional int32 status = 1;
}

message PingRequest {
  optional int64 timestamp = 1;
}

message PingResponse {
  optional int64 timestamp = 1;
}

message NavigationFocusRequest {
  optional uint32 type = 1;
}

message NavigationFocusResponse {
  optional uint32 type = 1;
}

message ShutdownRequest {
  optional int32 reason = 1;
}

message ShutdownResponse {
}

message AVChannelSetupRequest {
  optional uint32 config_index = 1;
}

message AVChannelSetupResponse {
  optional int32 media_status = 1;
  optional uint32 max_unacked = 2;
  repeated uint32 configs = 3;
}

message AVChannelStartIndication {
  optional int32 session = 1;
  optional uint32 config = 2;
}

message AVMediaAckIndication {
  optional int32 session = 1;
  optional uint32 value = 2;
}

message VideoFocusRequest {
  optional int32 disp_index = 1;
  optional int32 focus_mode = 2;
  optional int32 focus_reason = 3;
}

message VideoFocusIndication {
  optional int32 focus_mode = 1;
  optional bool unrequested = 2;
}

message TouchLocation {
  optional uint32 x = 1;
  optional uint32 y = 2;
  optional uint32 pointer_id = 3;
}

message TouchEvent {
  repeated TouchLocation touch_location = 1;
  optional int32 touch_action = 2;
  optional uint32 action_index = 3;
}

message ButtonEvent {
  optional uint32 scan_code = 1;
  optional bool is_pressed = 2;
  optional uint32 meta = 3;
  optional bool long_press = 4;
}

message ButtonEvents {
  repeated ButtonEvent button = 1;
}

message InputEventIndication {
  optional uint64 timestamp = 1;
  optional int32 disp_channel = 2;
  optional TouchEvent touch_event = 3;
  optional ButtonEvents button_event = 4;
}

message BindingRequest {
  repeated int32 scan_codes = 1;
}

message BindingResponse {
  optional int32 status = 1;
}

message SensorStartRequest {
  optional int32 sensor_type = 1;
  optional int64 refresh_interval = 2;
}

message SensorStartResponse {
  optional int32 status = 1;
}

message NightMode {
  optional bool is_night = 1;
}

message DrivingStatus {
  optional int32 status = 1;
}

message SensorEventIndication {
  repeated NightMode night_mode = 9;
  repeated DrivingStatus driving_status = 12;
}
