sample:
  name: Android Auto head unit
  description: Decode an Android Auto phone's projected screen and show it on a display
common:
  modules:
    - nanopb
    - h264bsd
  tags:
    - usb
    - display
    - samples
tests:
  sample.usb.android_auto_headunit.tcp:
    # No window to open on a build machine, so decode into a dummy display
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_args: DTC_OVERLAY_FILE="headless.overlay"
    extra_configs:
      - CONFIG_SDL_DISPLAY=n
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Android Auto head unit ready"
    timeout: 30
  sample.usb.android_auto_headunit.sdl:
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
  sample.usb.android_auto_headunit.usb_host:
    build_only: true
    platform_allow:
      - stm32n6570_dk/stm32n657xx/sb
    integration_platforms:
      - stm32n6570_dk/stm32n657xx/sb
