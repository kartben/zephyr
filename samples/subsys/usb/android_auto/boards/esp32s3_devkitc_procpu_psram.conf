CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_AA_TRANSPORT_USB=y
CONFIG_SAMPLE_USBD_PID=0x0014
CONFIG_SAMPLE_USBD_PRODUCT="Android Auto accessory"
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

CONFIG_SAMPLE_AA_TX_CHUNK_SIZE=8192
CONFIG_SAMPLE_AA_RX_FRAME_SIZE=4160
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=8192
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_HEAP_SIZE=40960

# External RAM holds the full-resolution framebuffer and the LVGL buffers
CONFIG_ESP_SPIRAM=y
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_SPIRAM_MODE_QUAD=y
