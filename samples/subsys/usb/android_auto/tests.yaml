sample:
  name: Android Auto accessory
  description: Stream the LVGL screen to an Android Auto head unit over USB or TCP
common:
  modules:
    - lvgl
    - nanopb
  tags:
    - usb
    - display
    - lvgl
    - samples
tests:
  sample.usb.android_auto.tcp:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_SAMPLE_AA_H264_SELFTEST=y
      - CONFIG_SAMPLE_AA_TCP_PORT=0
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "aa: video self-test OK"
        - "Android Auto sample ready"
    timeout: 60
  sample.usb.android_auto.tcp.scale2:
    platform_allow:
      - native_sim
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="scale2.overlay"
    extra_configs:
      - CONFIG_SAMPLE_AA_H264_SELFTEST=y
      - CONFIG_SAMPLE_AA_TCP_PORT=0
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "aa: video self-test OK"
        - "Android Auto sample ready"
    timeout: 60
  sample.usb.android_auto.usb:
    build_only: true
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
      - m5stack_stamps3/esp32s3/procpu
      - twatch_s3/esp32s3/procpu
    integration_platforms:
      - esp32s3_devkitc/esp32s3/procpu
