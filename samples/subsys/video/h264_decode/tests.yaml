sample:
  name: H.264 software decode
tests:
  sample.video.h264_decode:
    tags:
      - video
      - samples
    extra_configs:
      - CONFIG_DISPLAY=n
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Decoded frame"
    platform_allow:
      - native_sim
      - stm32n6570_dk
    integration_platforms:
      - native_sim
    build_only: true
