sample:
  name: Watchdog Driver Sample
common:
  tags:
    - drivers
    - watchdog
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "Watchdog sample application"
      - "Feeding watchdog..."
      - "Waiting for reset..."
      - "Watchdog sample application"
  depends_on: watchdog
tests:
  sample.drivers.watchdog:
    filter: dt_alias_exists("watchdog0") and
      not (CONFIG_SOC_FAMILY_STM32 or CONFIG_SOC_FAMILY_GD_GD32 or SOC_SERIES_GD32VF103)
    platform_exclude:
      - s32z2xxdc2/s32z270/rtu0
      - s32z2xxdc2/s32z270/rtu1
      - s32z2xxdc2@D/s32z270/rtu0
      - s32z2xxdc2@D/s32z270/rtu1
      - s32k5xxcvb/s32k566/r52
      - panb611evb/nrf54l15/cpuapp
      - panb611evb/nrf54l15/cpuapp/ns
      - panb611evb/nrf54l15/cpuflpr
      - panb611evb/nrf54l15/cpuflpr/xip
      - nrf54lm20dk/nrf54lm20a/cpuapp/ns
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
      - nrf54l15dk/nrf54l15/cpuapp/ns
      - nrf54l15dk/nrf54l10/cpuapp/ns
      - nrf54l15tag/nrf54l15/cpuapp
      - nrf54l15tag/nrf54l15/cpuapp/ns
      - nrf54l15tag/nrf54l15/cpuflpr
      - nrf54l15tag/nrf54l15/cpuflpr/xip
      - nrf7120dk/nrf7120/cpuapp/ns
      - bl54l15_dvk/nrf54l10/cpuapp/ns
      - bl54l15_dvk/nrf54l15/cpuapp/ns
      - raytac_an54lq_db_15/nrf54l15/cpuapp/ns
      - raytac_an54lv_db_15/nrf54l15/cpuapp/ns
    platform_allow:
      - adp_xc7k/ae350
      - adp_xc7k/ae350/clic
      - bl54l15_dvk/nrf54l10/cpuapp
      - bl54l15_dvk/nrf54l15/cpuapp
      - bl54l15_dvk/nrf54l15/cpuflpr
      - bl54l15_dvk/nrf54l15/cpuflpr/xip
      - cc1352r1_launchxl
      - cc26x2r1_launchxl
      - ch32v003evt
      - ch32v006evt
      - esp32_devkitc/esp32/procpu
      - esp32s2_saola
      - intel_adl_crb
      - intel_adl_rvp
      - intel_btl_s_crb
      - intel_ehl_crb
      - intel_rpl_p_crb
      - intel_rpl_s_crb
      - mps2/an385
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpunet
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l05/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9280pdk/nrf9280/cpuapp
      - opentitan_earlgrey
      - ophelia4ev/nrf54l15/cpuapp
      - pic32cm_gc00_cpro
      - pic32cm_jh01_cpro
      - pic32cm_sg00_cpro
      - pic32cx_sg41_cult
      - pic32cx_sg61_cult
      - pic32cz_ca80_cult
      - pic32cz_ca90_cult
      - raytac_an54lq_db_15/nrf54l15/cpuapp
      - raytac_an54lq_db_15/nrf54l15/cpuflpr
      - raytac_an54lq_db_15/nrf54l15/cpuflpr/xip
      - sam_e54_xpro
      - siwx917_dk2605a
      - siwx917_ek2708a
      - siwx917_rb4338a
      - siwx917_rb4342a
      - xiao_nrf54l15/nrf54l15/cpuapp
      - xiao_nrf54l15/nrf54l15/cpuflpr
      - xmc45_relax_kit
      - xmc47_relax_kit
    integration_platforms:
      - mps2/an385
  sample.drivers.watchdog.stm32_wwdg:
    extra_args: DTC_OVERLAY_FILE=boards/stm32_wwdg.overlay
    filter: dt_compat_enabled("st,stm32-window-watchdog")
    platform_allow:
      - b_u585i_iot02a
      - nucleo_c031c6
      - nucleo_f091rc
      - nucleo_f103rb
      - nucleo_f207zg
      - nucleo_f429zi
      - nucleo_f746zg
      - nucleo_g071rb
      - nucleo_g474re
      - nucleo_l073rz
      - nucleo_l152re
      - nucleo_u385rg_q
      - nucleo_wb55rg
      - nucleo_wl55jc
      - stm32f3_disco
      - stm32l562e_dk
      - disco_l475_iot1
      - stm32h573i_dk
    integration_platforms:
      - nucleo_f103rb
  sample.drivers.watchdog.stm32h7_wwdg:
    extra_args: DTC_OVERLAY_FILE=boards/stm32h7_wwdg.overlay
    filter: dt_compat_enabled("st,stm32-window-watchdog")
    # filter CONFIG_SOC_SERIES_STM32H7X and dt_compat_enabled
    # seems to ignore extra_args
    platform_allow:
      - nucleo_h723zg
      - nucleo_h745zi_q/stm32h745xx/m4
      - nucleo_h743zi
      - stm32h735g_disco
      - nucleo_h753zi
      - stm32h750b_dk
      - stm32h7b3i_dk
      - stm32h745i_disco/stm32h745xx/m4
      - nucleo_h755zi_q/stm32h755xx/m4
      - stm32h747i_disco/stm32h747xx/m4
    integration_platforms:
      - nucleo_h753zi
  sample.drivers.watchdog.stm32_iwdg:
    extra_args: DTC_OVERLAY_FILE=boards/stm32_iwdg.overlay
    filter: dt_compat_enabled("st,stm32-watchdog")
    platform_allow:
      - b_u585i_iot02a
      - nucleo_c031c6
      - nucleo_f091rc
      - nucleo_f103rb
      - nucleo_f207zg
      - nucleo_f429zi
      - nucleo_f746zg
      - nucleo_g071rb
      - nucleo_g474re
      - nucleo_h743zi
      - nucleo_h753zi
      - nucleo_l073rz
      - nucleo_l152re
      - nucleo_u385rg_q
      - nucleo_wb55rg
      - nucleo_wl55jc
      - stm32f3_disco
      - stm32l562e_dk
      - disco_l475_iot1
      - stm32h573i_dk
    integration_platforms:
      - nucleo_f103rb
  sample.drivers.watchdog.stm32_iwdg_ewi:
    extra_args: DTC_OVERLAY_FILE=boards/stm32_iwdg.overlay
    filter: dt_compat_enabled("st,stm32-watchdog")
    extra_configs:
      - CONFIG_IWDG_STM32_EARLY_WAKEUP=y
    platform_allow:
      - nucleo_h563zi
      - nucleo_h7s3l8
      - nucleo_u083rc
      - nucleo_u385rg_q
      - nucleo_u575zi_q
      - b_u585i_iot02a
      - nucleo_wba55cg
    integration_platforms:
      - nucleo_wba55cg
  sample.drivers.watchdog.gd32_fwdgt:
    filter: dt_compat_enabled("gd,gd32-fwdgt")
    extra_args: DTC_OVERLAY_FILE=boards/gd32_fwdgt.overlay
    platform_allow:
      - gd32e103v_eval
      - gd32e507v_start
      - gd32f350r_eval
      - gd32f403z_eval
      - gd32f450i_eval
      - gd32f450z_eval
      - gd32f470i_eval
      - gd32vf103c_starter
      - gd32vf103v_eval
      - longan_nano
    integration_platforms:
      - gd32e103v_eval
  sample.drivers.watchdog.gd32_wwdgt:
    filter: dt_compat_enabled("gd,gd32-wwdgt")
    extra_args: DTC_OVERLAY_FILE=boards/gd32_wwdgt.overlay
    platform_allow:
      - gd32e103v_eval
      - gd32e507v_start
      - gd32f350r_eval
      - gd32f403z_eval
      - gd32f450i_eval
      - gd32f450z_eval
      - gd32f470i_eval
      - gd32vf103c_starter
      - gd32vf103v_eval
      - longan_nano
    integration_platforms:
      - gd32e103v_eval
  sample.drivers.watchdog.nxp_s32_swt:
    build_only: true
    platform_allow:
      - s32z2xxdc2/s32z270/rtu0
      - s32z2xxdc2/s32z270/rtu1
      - s32z2xxdc2@D/s32z270/rtu0
      - s32z2xxdc2@D/s32z270/rtu1
      - s32k5xxcvb/s32k566/r52
    integration_platforms:
      - s32z2xxdc2/s32z270/rtu0
  sample.drivers.watchdog.nrf_gswdt:
    filter: dt_compat_enabled("nordic,nrf-gswdt")
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
    extra_args:
      - FILE_SUFFIX=nrf_gswdt
