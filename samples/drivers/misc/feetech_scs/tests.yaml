sample:
  name: Feetech SCS servo
  description: Read feedback from and move Feetech SCS serial bus servos.
tests:
  sample.drivers.misc.feetech_scs:
    tags:
      - misc
    filter: dt_compat_enabled("feetech,scs0009")
    integration_platforms:
      - m5stack_stackchan/esp32s3/procpu
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Torque disabled"
