# Security hardening database fragment for EEPROM drivers.

rules:
  EEPROM_SHELL:
    value: n
    rationale: |
      The EEPROM shell provides raw read and write commands for EEPROM devices, which typically hold
      calibration data, identity and credentials; console access becomes full disclosure and tamper
      access to that data.
    references: [CWE-489]
