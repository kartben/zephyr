# Security hardening database fragment for flash drivers.

rules:
  FLASH_SHELL:
    value: n
    rationale: |
      The flash shell gives anyone with console access raw read, write and erase commands over every
      flash device, enough to dump firmware and stored secrets or corrupt the image. On ARM it
      additionally selects MPU_ALLOW_FLASH_WRITE, relaxing MPU protection of the flash region for
      the whole system.
    references: [CWE-489]
