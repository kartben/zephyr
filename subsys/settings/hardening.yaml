#
# Security hardening database fragment for the settings subsystem.

rules:
  SETTINGS_SHELL:
    value: n
    rationale: |
      Shell commands for listing and reading settings expose the persisted state of every subsystem,
      including Bluetooth bonding keys and application credentials stored through the settings API,
      to anyone holding the console.
    references: [CWE-200]
