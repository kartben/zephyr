# Security hardening database fragment for the Arm64 architecture.

rules:
  ARM64_PMUV3_USER_ACCESS:
    value: n
    rationale: |
      Exposes the PMU cycle and event counters to unprivileged code, giving user mode a
      high-resolution timing oracle for cache and speculation side-channel attacks against the
      kernel and other threads.
    references: [CWE-203]
