# QEMU only emulates COM2 when a second serial port is given
CONFIG_QEMU_EXTRA_FLAGS="-serial null"

# The QEMU 16550 transmits instantly, transfers cannot be aborted midway
CONFIG_TEST_ABORT_ONGOING_TRANSFER=n
