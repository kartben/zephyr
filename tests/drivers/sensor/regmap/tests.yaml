common:
  tags:
    - drivers
    - sensor
    - emul
  platform_allow:
    - native_sim
    - mps2/an385
  integration_platforms:
    - native_sim
    - mps2/an385
  harness: ztest
  timeout: 120

tests:
  drivers.sensor.regmap: {}
  drivers.sensor.regmap.tmp116:
    extra_configs:
      - CONFIG_SENSOR_EMUL_TMP116=y
  drivers.sensor.regmap.generic:
    extra_args: DTC_OVERLAY_FILE=generic.overlay
    extra_configs:
      - CONFIG_GENERIC_SENSOR_TEST=y
      - CONFIG_SENSOR_ASYNC_API=y
      - CONFIG_RTIO_WORKQ_THREADS_POOL_STACK_SIZE=8192
      - CONFIG_ZTEST_THREAD_PRIORITY=1
      - CONFIG_GPIO=y
      - CONFIG_BMA280_TRIGGER_NONE=y
      - CONFIG_VCNL4040_ENABLE_ALS=y
