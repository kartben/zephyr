CONFIG_ZTEST=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_I2C_RTIO=y
# For the emulated I2C controller of native_sim; no emulator backs the device
CONFIG_EMUL=y
# Device init fails without an emulator, only the decoder is tested
CONFIG_SENSOR_LOG_LEVEL_OFF=y
