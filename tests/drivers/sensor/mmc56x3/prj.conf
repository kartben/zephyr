CONFIG_ZTEST=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
# Enables the emulated I2C controller the device sits on
CONFIG_EMUL=y
# No emulator backs the device itself, so its initialization fails: only its decoder is tested
CONFIG_SENSOR_LOG_LEVEL_OFF=y
