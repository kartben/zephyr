common:
  tags:
    - drivers
    - sensor
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
tests:
  drivers.sensor.iis3dwb.decoder: {}
  drivers.sensor.iis3dwb.decoder.temp:
    extra_configs:
      - CONFIG_IIS3DWB_ENABLE_TEMP=y
  drivers.sensor.iis3dwb.decoder.no_stream:
    extra_configs:
      - CONFIG_IIS3DWB_STREAM=n
      - CONFIG_IIS3DWB_ENABLE_TEMP=y
