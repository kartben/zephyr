# POSIX porting layer support
CONFIG_POSIX_API=y
CONFIG_POSIX_MESSAGE_PASSING=y
CONFIG_POSIX_PRIORITY_SCHEDULING=y

# Provide pthread objects and stacks without measuring heap allocation during
# pthread creation. Thread-Metric uses at most five threads at a time.
CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=5
CONFIG_POSIX_THREAD_THREADS_MAX=5

# POSIX message queues and the memory allocation benchmark use the system heap.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# times() is the only interface in POSIX_MULTI_PROCESS that the suite would pull
# in, and it selects thread runtime statistics, which add accounting to every
# context switch. Nothing here needs the group once tm_thread_sleep() uses
# nanosleep(), so decline it and measure the POSIX API rather than the accounting.
CONFIG_POSIX_MULTI_PROCESS=n
