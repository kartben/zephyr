description: Fake GPIO controller, used by the DT Doctor integration test

compatible: "vnd,dtdoctor-gpio"

gpio-cells:
  - pin
  - flags

properties:
  gpio-controller:
    type: boolean
    required: true
  "#gpio-cells":
    type: int
    required: true
