description: Test GPIO controller, for the specifier cell diagnoses

compatible: "vnd,gpio-ctrl"

gpio-cells:
  - pin
  - flags

properties:
  gpio-controller:
    type: boolean
    required: true
  "#gpio-cells":
    type: int
    required: true
