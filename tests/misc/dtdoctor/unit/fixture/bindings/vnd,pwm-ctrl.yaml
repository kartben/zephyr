description: |
  Test PWM controller. A second specifier space, with a different cell count from
  the GPIO one, so the diagnoses are pinned as working on any phandle-array rather
  than just on 'gpios'.

compatible: "vnd,pwm-ctrl"

pwm-cells:
  - channel
  - period

properties:
  "#pwm-cells":
    type: int
    required: true
