tests:
  arch.arm.switch_restore:
    tags:
      - arm
      - kernel
    arch_allow:
      - arm
    filter: CONFIG_USE_SWITCH_SUPPORTED
    platform_allow:
      - qemu_cortex_m3
      - mps2/an521/cpu0
      - mps3/corstone300/an547
      - mps3/corstone300/fvp
  arch.arm.switch_restore.fpu:
    tags:
      - arm
      - fpu
      - kernel
    platform_allow:
      - mps2/an386
      - mps3/corstone300/an547
    extra_configs:
      - CONFIG_FPU=y
      - CONFIG_FPU_SHARING=y
